<script>
    // Some embedded viewers block prompt() and alert(). Without these guards the
    // first call throws and everything below it — including the output written
    // at the end — never runs, leaving the page blank.
    function askUser(message, fallback) {
        try {
            var value = prompt(message, fallback);
            return (value === null || value === "") ? fallback : value;
        } catch (e) {
            return fallback;
        }
    }
    function notify(message) {
        try { alert(message); } catch (e) { /* alerts unavailable */ }
    }

    var myColor = askUser("Please enter a hexadecimal color code (must be 6 characters, including 0 thru 9 and A thru F):", "FFFFFF");
    var myAge = askUser("Please enter your age:", "25");

    if ((myColor == null) || (myColor == "") || (myColor.length !== 6)) {
        myColor = "FFFFFF";
    }

    document.cookie = "userSettings=" + "YColor=" + myColor + " " + "age=" + myAge + ";expires=20-May-2030;";

    notify("A cookie has been set on your system.");

    var start = document.cookie.indexOf("YColor=");
    if (start != -1) {
        start = start + 7;
        var pos = "#" + document.cookie.substr(start, 6);
        document.bgColor = pos;
        notify("Your background color will be: " + pos);
    } else {
        notify("No valid color found in the cookie.");
    }

    var ageStart = document.cookie.indexOf("age=");
    if (ageStart != -1) {
        ageStart = ageStart + 4;
        var userAge = document.cookie.substr(ageStart, 25);
        notify("Your age is: " + userAge);
    } else {
        notify("No valid age found in the cookie.");
    }

    document.write("Your background color is: " + document.bgColor + "<br>");
    document.write("Your age is: " + window.userAge + "<br>");
</script>

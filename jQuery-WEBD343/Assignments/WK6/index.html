<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>jQuery Image Slider</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="slider">
    <img src="images/slide1.jpg" class="active" alt="Beach sunrise">
    <img src="images/slide2.jpg" alt="Pier at sunset">
    <img src="images/slide3.jpg" alt="Dunes and ocean">
    <button id="prev">&#10094;</button>
    <button id="next">&#10095;</button>
  </div>

  <script src="jquery.js"></script>
  <script src="app.js"></script>
</body>
</html>
